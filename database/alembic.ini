# Alembic schema migrations. URL comes from DATABASE_URL (database/migrations/env.py).
#   python -m database.manage migrate up      # = alembic upgrade head
#   python -m database.manage migrate down    # = alembic downgrade base
# NOTE: keep this file ASCII-only - Alembic reads it with the locale encoding
# (cp1252 on Windows), non-ASCII characters break parsing.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
version_path_separator = os
# split prepend_sys_path by os.pathsep only: the repo path may contain spaces
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
