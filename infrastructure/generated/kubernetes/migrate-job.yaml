# Сгенерировано infrastructure/render.py из experiments/configs/bench.yaml.
# Не редактировать вручную: python -m infrastructure.render
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: arch-bench
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: docker.io/mustafaalrawi8/arch-bench-app:2.1.0
        imagePullPolicy: IfNotPresent
        args:
        - python
        - -m
        - database.manage
        - migrate
        - up
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: arch-bench-secrets
              key: DATABASE_URL
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 512Mi
