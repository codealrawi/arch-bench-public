# Сгенерировано infrastructure/render.py из experiments/configs/bench.yaml.
# Не редактировать вручную: python -m infrastructure.render
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-microservices
  namespace: arch-bench
data:
  nginx.conf: "# Сгенерировано infrastructure/render.py из experiments/configs/bench.yaml\
    \ — не редактировать.\nworker_processes 1;\nevents { worker_connections 16384;\
    \ }\nhttp {\n    access_log off;\n    sendfile on;\n    server_tokens off;\n \
    \   client_max_body_size 64k;\n    include /etc/nginx/mime.types;\n    default_type\
    \ application/octet-stream;\n\n    server {\n        listen 8080;\n        location\
    \ /api/ {\n            proxy_pass http://gateway.arch-bench.svc.cluster.local:8000;\n\
    \            proxy_http_version 1.1;\n            proxy_set_header Connection\
    \ \"\";\n            proxy_set_header Host $host;\n            proxy_set_header\
    \ X-Forwarded-For $remote_addr;\n            proxy_set_header X-Request-Id $request_id;\n\
    \            proxy_read_timeout 30s;\n            proxy_send_timeout 30s;\n  \
    \      }\n        location / {\n            root /usr/share/nginx/html;\n    \
    \        try_files $uri /index.html;\n            add_header X-Content-Type-Options\
    \ nosniff always;\n            add_header X-Frame-Options DENY always;\n     \
    \       add_header Referrer-Policy no-referrer always;\n            add_header\
    \ Content-Security-Policy \"default-src 'self'; img-src 'self' data:; connect-src\
    \ 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'\" always;\n\
    \        }\n    }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-microservices
  namespace: arch-bench
  labels:
    app: ui-microservices
    arch-bench/role: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-microservices
  template:
    metadata:
      labels:
        app: ui-microservices
        arch-bench/role: ui
    spec:
      containers:
      - name: nginx
        image: arch-bench-frontend:2.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: conf
        configMap:
          name: ui-microservices
---
apiVersion: v1
kind: Service
metadata:
  name: ui-microservices
  namespace: arch-bench
spec:
  type: NodePort
  selector:
    app: ui-microservices
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui-microservices
  namespace: arch-bench
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui-microservices
            port:
              number: 8080
