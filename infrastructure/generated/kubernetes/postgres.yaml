# Сгенерировано infrastructure/render.py из experiments/configs/bench.yaml.
# Не редактировать вручную: python -m infrastructure.render
apiVersion: v1
kind: Namespace
metadata:
  name: arch-bench
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-conf
  namespace: arch-bench
data:
  postgresql.conf: '# Сгенерировано infrastructure/render.py из experiments/configs/bench.yaml
    — не редактировать.

    max_connections = 100

    effective_cache_size = 3GB

    listen_addresses = ''*''

    maintenance_work_mem = 256MB

    max_wal_size = 2GB

    pg_stat_statements.track = top

    random_page_cost = 1.1

    shared_buffers = 1GB

    shared_preload_libraries = ''pg_stat_statements''

    synchronous_commit = on

    work_mem = 16MB

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: arch-bench
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: arch-bench
  labels:
    app: postgres
    arch-bench/role: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        arch-bench/role: database
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: postgres
        image: postgres:16
        args:
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        env:
        - name: POSTGRES_DB
          value: bench
        - name: POSTGRES_USER
          value: bench
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: arch-bench-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 2000m
            memory: 4096Mi
          limits:
            cpu: 2000m
            memory: 4096Mi
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - bench
            - -d
            - bench
          periodSeconds: 2
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - bench
          periodSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - name: conf
          mountPath: /etc/postgresql
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: conf
        configMap:
          name: postgres-conf
      - name: data
        persistentVolumeClaim:
          claimName: pgdata
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: arch-bench
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
