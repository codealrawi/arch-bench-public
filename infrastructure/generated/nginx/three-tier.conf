# Сгенерировано infrastructure/render.py из experiments/configs/bench.yaml — не редактировать.
worker_processes 1;
events { worker_connections 16384; }
http {
    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 64k;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    upstream backend { server backend:8000; keepalive 256; }

    server {
        listen 8080;
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location = /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location = /readiness {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location = /metrics { return 404; }
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        }
    }
}
